<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dynamic Workers Demo</title>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				font-size: 14px;
				line-height: 1.5;
				color: #333;
				display: flex;
				flex-direction: column;
				height: 100dvh;
				margin: 0;
				padding: 8px;
				gap: 8px;
				overflow: hidden;
				background: #f5f5f5;
			}

			[hidden] {
				display: none !important;
			}

			select,
			input[type='text'] {
				padding: 8px;
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
				font-size: 13px;
				border: 1px solid #ccc;
				border-radius: 4px;
				background: white;
			}

			input[type='text'] {
				font-family: inherit;
			}

			/* Rows that wrap gracefully at ~360px. Fixed-size in the column —
			   only .pane-host flexes, so these must never be squeezed. */
			.topbar,
			.url-row,
			.footer {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: center;
				flex: 0 0 auto;
			}

			#example {
				flex: 0 1 auto;
				max-width: 100%;
			}

			#url {
				flex: 1 1 200px;
				min-width: 0;
			}

			#editor-perms {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
			}

			.perm-caption {
				font-size: 12px;
				font-weight: 600;
				color: #555;
			}

			.perm-badge {
				padding: 2px 8px;
				border-radius: 10px;
				font-size: 11px;
				border: 1px solid;
				cursor: default;
				white-space: nowrap;
			}

			.perm-badge-net {
				background: #e7f1fb;
				border-color: #9dc3ea;
				color: #0b4f8f;
			}

			.perm-badge-storage {
				background: #eee9fa;
				border-color: #bbaae5;
				color: #4b3391;
			}

			.perm-badge-limit {
				background: #fdf3e3;
				border-color: #e4c88f;
				color: #7a5308;
			}

			.perm-badge-none {
				background: #eef4ee;
				border-color: #a9c8a9;
				color: #2c5f2c;
			}

			button {
				padding: 8px 16px;
				background: #0066cc;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 600;
				transition: background-color 0.2s;
			}

			button:hover:not(:disabled) {
				background: #0052a3;
			}

			button:disabled {
				background: #ccc;
				cursor: not-allowed;
			}

			#run-button {
				flex: 0 0 auto;
			}

			/* One unified strip of source-file tabs + (post-run) result tabs. */
			.tab-strip {
				display: flex;
				align-items: center;
				gap: 4px;
				overflow-x: auto;
				flex: 0 0 auto;
			}

			#tab-strip-tabs {
				display: flex;
				align-items: center;
				gap: 4px;
			}

			.editor-tab {
				padding: 6px 12px;
				background: #e0e0e0;
				border: 1px solid #999;
				border-bottom: none;
				border-radius: 4px 4px 0 0;
				cursor: pointer;
				font-size: 12px;
				font-weight: 400;
				color: #333;
				white-space: nowrap;
			}

			.editor-tab:hover {
				background: #d0d0d0;
			}

			.editor-tab.active {
				background: white;
				color: #0066cc;
				font-weight: 600;
			}

			/* Separate the result-tab group from the source-file group. */
			.editor-tab.result-tab:first-of-type {
				margin-left: auto;
			}

			#editor-status {
				font-size: 12px;
				font-style: italic;
				color: #a66300;
				white-space: nowrap;
			}

			#editor-reset {
				padding: 2px 10px;
				font-size: 12px;
				font-weight: 400;
				flex: 0 0 auto;
			}

			.pane-host {
				flex: 1 1 auto;
				min-height: 0;
				position: relative;
			}

			.pane {
				height: 100%;
				overflow: auto;
				background: white;
				border: 1px solid #ccc;
				border-radius: 4px;
			}

			#editor {
				height: 100%;
			}

			.cm-editor {
				height: 100%;
				background: white;
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
				font-size: 13px;
			}

			.cm-editor.cm-focused {
				outline: 2px solid #0066cc33;
			}

			.cm-scroller {
				overflow: auto;
			}

			/* The output pane keeps a fixed-size toolbar and lets the JSON/rendered
			   view flex to fill the rest. */
			#output-pane {
				display: flex;
				flex-direction: column;
				padding: 0;
			}

			.output-toolbar {
				flex: 0 0 auto;
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 12px;
				border-bottom: 1px solid #eee;
			}

			#results-title {
				font-size: 14px;
				font-weight: 600;
				color: #0066cc;
			}

			#output-pane.error #results-title {
				color: #c00;
			}

			#output-pane.ok #results-title {
				color: #060;
			}

			#output-toggle {
				margin-left: auto;
				display: flex;
				gap: 4px;
			}

			#output-toggle button {
				padding: 2px 10px;
				font-size: 12px;
				font-weight: 400;
			}

			#output-rendered {
				flex: 1 1 auto;
				min-height: 0;
				width: 100%;
				height: 100%;
				border: 0;
				background: white;
			}

			#output-json {
				flex: 1 1 auto;
				min-height: 0;
				overflow: auto;
				margin: 0;
			}

			pre {
				background: #f0f0f0;
				padding: 8px 12px;
				white-space: pre-wrap;
				word-wrap: break-word;
				font-size: 12px;
			}

			#logs-pane,
			#trace-pane {
				padding: 12px;
				font-size: 12px;
			}

			.logs-empty {
				color: #999;
				font-style: italic;
			}

			.logs-truncated {
				background: #fffacd;
				border: 1px solid #daa;
				border-radius: 4px;
				padding: 8px;
				margin-top: 8px;
				color: #666;
				font-size: 12px;
			}

			.trace-rows {
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
			}

			.trace-row {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 18px;
				line-height: 18px;
			}

			.trace-label {
				flex: 0 0 auto;
				max-width: 40%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 11px;
				color: #444;
			}

			.trace-track {
				position: relative;
				flex: 1 1 auto;
				height: 10px;
				background: #eee;
				border-radius: 2px;
			}

			.trace-bar {
				position: absolute;
				top: 0;
				height: 100%;
				border-radius: 2px;
			}

			.trace-bar-ok {
				background: #2f7de1;
			}

			.trace-bar-error {
				background: #c00;
			}

			.trace-bar-phase {
				background: #999;
			}

			.footer {
				flex: 0 0 auto;
				font-size: 12px;
				color: #666;
			}

			#clear-store-button {
				padding: 2px 10px;
				font-size: 12px;
				font-weight: 400;
			}

			#clear-store-status,
			#timing-info {
				font-size: 12px;
				color: #555;
			}

			#timing-info {
				margin-left: auto;
			}
		</style>
	</head>
	<body>
		<header class="topbar">
			<select id="example">
				<option value="">-- Select an example --</option>
			</select>
			<div id="editor-perms" hidden></div>
		</header>

		<div class="url-row">
			<input type="text" id="url" list="url-suggestions" placeholder="https://example.com" />
			<datalist id="url-suggestions"></datalist>
			<button id="run-button" disabled>Run</button>
		</div>

		<div class="tab-strip">
			<div id="tab-strip-tabs"></div>
			<span id="editor-status" hidden>edited — runs as custom code</span>
			<button type="button" id="editor-reset" hidden>Reset</button>
		</div>

		<main class="pane-host">
			<div id="editor" class="pane"></div>

			<div id="output-pane" class="pane" hidden>
				<div class="output-toolbar">
					<span id="results-title"></span>
					<div id="output-toggle" hidden>
						<button type="button" data-view="rendered">Rendered</button>
						<button type="button" data-view="json">JSON</button>
					</div>
				</div>
				<iframe id="output-rendered" sandbox="allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
				<pre id="output-json"></pre>
			</div>

			<div id="logs-pane" class="pane" hidden></div>

			<div id="trace-pane" class="pane" hidden></div>
		</main>

		<footer class="footer">
			<div id="turnstile"></div>
			<button type="button" id="clear-store-button" hidden>Clear stored data</button>
			<span id="clear-store-status"></span>
			<span id="timing-info"></span>
		</footer>

		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
		<script src="/app.js"></script>
	</body>
</html>
