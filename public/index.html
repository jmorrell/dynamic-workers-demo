<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dynamic Workers Demo</title>
		<style>
			* {
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				font-size: 14px;
				line-height: 1.5;
				color: #333;
				margin: 0;
				padding: 16px;
				background: #f5f5f5;
			}

			h1 {
				margin-top: 0;
				margin-bottom: 16px;
				font-size: 20px;
			}

			section {
				margin-bottom: 16px;
			}

			label {
				display: block;
				margin-bottom: 4px;
				font-weight: 600;
				color: #222;
			}

			select,
			input[type='text'],
			textarea {
				width: 100%;
				padding: 8px;
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
				font-size: 13px;
				border: 1px solid #ccc;
				border-radius: 4px;
				background: white;
			}

			input[type='text'] {
				padding: 10px;
				font-family: inherit;
			}

			.chips {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				margin-top: 8px;
				margin-bottom: 8px;
			}

			.chip {
				padding: 6px 12px;
				background: #e0e0e0;
				border: 1px solid #999;
				border-radius: 16px;
				cursor: pointer;
				font-size: 12px;
				white-space: nowrap;
				transition: background-color 0.2s;
			}

			.chip:hover {
				background: #d0d0d0;
			}

			.chip:active {
				background: #c0c0c0;
			}

			.editor-label-row {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 4px;
			}

			.editor-label-row label {
				margin-bottom: 0;
			}

			#editor-status {
				display: none;
				font-size: 12px;
				font-style: italic;
				color: #a66300;
			}

			#editor-perms {
				display: none;
				flex-wrap: wrap;
				align-items: center;
				gap: 6px;
				margin-bottom: 6px;
			}

			.perm-caption {
				font-size: 12px;
				font-weight: 600;
				color: #555;
			}

			.perm-badge {
				padding: 2px 8px;
				border-radius: 10px;
				font-size: 11px;
				border: 1px solid;
				cursor: default;
				white-space: nowrap;
			}

			.perm-badge-net {
				background: #e7f1fb;
				border-color: #9dc3ea;
				color: #0b4f8f;
			}

			.perm-badge-storage {
				background: #eee9fa;
				border-color: #bbaae5;
				color: #4b3391;
			}

			.perm-badge-limit {
				background: #fdf3e3;
				border-color: #e4c88f;
				color: #7a5308;
			}

			.perm-badge-none {
				background: #eef4ee;
				border-color: #a9c8a9;
				color: #2c5f2c;
			}

			.storage-row {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-bottom: 4px;
			}

			#clear-store-button {
				display: none;
				padding: 2px 10px;
				font-size: 12px;
				font-weight: 400;
			}

			#clear-store-status {
				display: none;
				font-size: 12px;
				color: #555;
			}

			#editor-reset {
				display: none;
				padding: 2px 10px;
				font-size: 12px;
				font-weight: 400;
			}

			#editor-tabs {
				display: none;
				gap: 4px;
				margin-bottom: -1px;
				position: relative;
				z-index: 1;
			}

			.editor-tab {
				padding: 6px 12px;
				background: #e0e0e0;
				border: 1px solid #999;
				border-bottom: none;
				border-radius: 4px 4px 0 0;
				cursor: pointer;
				font-size: 12px;
				font-weight: 400;
				color: #333;
			}

			.editor-tab:hover {
				background: #d0d0d0;
			}

			.editor-tab.active {
				background: white;
				color: #0066cc;
				font-weight: 600;
			}

			button {
				padding: 10px 16px;
				background: #0066cc;
				color: white;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 600;
				transition: background-color 0.2s;
			}

			button:hover:not(:disabled) {
				background: #0052a3;
			}

			button:disabled {
				background: #ccc;
				cursor: not-allowed;
			}

			.cm-editor {
				border: 1px solid #ccc;
				border-radius: 4px;
				background: white;
				min-height: 260px;
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
				font-size: 13px;
			}

			.cm-editor.cm-focused {
				outline: 2px solid #0066cc33;
			}

			#results {
				background: white;
				border: 1px solid #ccc;
				border-radius: 4px;
				padding: 12px;
				margin-top: 16px;
			}

			#results.empty {
				display: none;
			}

			#results h3 {
				margin: 0 0 8px 0;
				font-size: 14px;
				color: #0066cc;
			}

			#results.error h3 {
				color: #c00;
			}

			#results.ok h3 {
				color: #060;
			}

			pre {
				background: #f0f0f0;
				border: 1px solid #ddd;
				border-radius: 4px;
				padding: 8px;
				overflow-x: auto;
				white-space: pre-wrap;
				word-wrap: break-word;
				margin: 8px 0;
				font-size: 12px;
			}

			.timing {
				color: #666;
				font-size: 12px;
				margin-top: 8px;
			}

			.logs-truncated {
				background: #fffacd;
				border: 1px solid #daa;
				border-radius: 4px;
				padding: 8px;
				margin-top: 8px;
				color: #666;
				font-size: 12px;
			}

			.error-text {
				color: #c00;
				font-weight: 600;
			}

			.success-text {
				color: #060;
				font-weight: 600;
			}

			#trace-container {
				margin-top: 8px;
			}

			.trace-details summary {
				cursor: pointer;
				font-size: 12px;
				font-weight: 600;
				color: #555;
			}

			.trace-rows {
				margin-top: 6px;
				font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
			}

			.trace-row {
				display: flex;
				align-items: center;
				gap: 8px;
				height: 18px;
				line-height: 18px;
			}

			.trace-label {
				flex: 0 0 auto;
				max-width: 40%;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 11px;
				color: #444;
			}

			.trace-track {
				position: relative;
				flex: 1 1 auto;
				height: 10px;
				background: #eee;
				border-radius: 2px;
			}

			.trace-bar {
				position: absolute;
				top: 0;
				height: 100%;
				border-radius: 2px;
			}

			.trace-bar-ok {
				background: #2f7de1;
			}

			.trace-bar-error {
				background: #c00;
			}

			.trace-bar-phase {
				background: #999;
			}
		</style>
	</head>
	<body>
		<h1>Dynamic Workers Demo</h1>

		<section>
			<label for="example">Choose an Example:</label>
			<select id="example">
				<option value="">-- Select an example --</option>
			</select>
		</section>

		<section id="suggested-urls-section" style="display: none">
			<label>Suggested URLs:</label>
			<div class="chips" id="suggested-urls"></div>
		</section>

		<section>
			<label for="url">Target URL:</label>
			<input type="text" id="url" placeholder="https://example.com" />
		</section>

		<section>
			<div class="editor-label-row">
				<label for="editor" style="margin-bottom: 0">Code (JavaScript or TypeScript):</label>
				<span id="editor-status">edited — runs as custom code</span>
				<button type="button" id="editor-reset">Reset</button>
			</div>
			<div id="editor-perms"></div>
			<div class="storage-row">
				<button type="button" id="clear-store-button">Clear stored data</button>
				<span id="clear-store-status"></span>
			</div>
			<div id="editor-tabs"></div>
			<div id="editor"></div>
		</section>

		<section>
			<div id="turnstile"></div>
		</section>

		<section>
			<button id="run-button" disabled>Run</button>
		</section>

		<section id="results" class="empty">
			<h3 id="results-title"></h3>
			<div id="results-body"></div>
			<div id="logs-container"></div>
			<div id="timing-info"></div>
			<div id="trace-container"></div>
		</section>

		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
		<script src="/app.js"></script>
	</body>
</html>
